name: impostor
on: pull_request
permissions:
  checks: write
jobs:
  write-check:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/check-runs -f name=firma/inspection -f head_sha=${{ github.event.pull_request.head.sha }} -f status=completed -f conclusion=success
  named-job:
    name: firma/inspection
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
